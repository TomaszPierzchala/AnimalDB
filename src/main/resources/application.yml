spring:
  application:
    name: animal-house

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:animaldb}
    username: ${DB_USERNAME:dbadmin}
    password: ${DB_PASSWORD:ANIMALDB_PASSWORD}

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/data

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}
